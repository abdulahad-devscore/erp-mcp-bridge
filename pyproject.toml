[project]
name = "erp-mcp-bridge"
version = "1.0.0"
description = "An MCP server that lets AI agents safely read from, and propose writes to, an Odoo ERP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy[asyncio]==2.1.6",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
    "pyjwt==2.15.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.1", "aiosqlite==0.22.1", "ruff==0.15.2"]

[project.scripts]
erp-bridge = "erp_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs the docker compose stack (Odoo) running"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# HTTP tests drive a server running in another thread; blocking calls are fine there.
"tests/test_http.py" = ["ASYNC210", "ASYNC212"]
